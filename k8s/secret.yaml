apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: crickbuzz
  labels:
    app.kubernetes.io/name: crickbuzz
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # PostgreSQL container bootstrap
  POSTGRES_USER: crickbuzz
  POSTGRES_PASSWORD: crickbuzz-secret-change-me
  POSTGRES_DB: crickbuzz
  # FastAPI application credentials (must match POSTGRES_* above)
  DB_USER: crickbuzz
  DB_PASSWORD: crickbuzz-secret-change-me

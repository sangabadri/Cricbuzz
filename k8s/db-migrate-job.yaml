apiVersion: batch/v1
kind: Job
metadata:
  name: crickbuzz-db-migrate
  namespace: crickbuzz
  labels:
    app.kubernetes.io/name: crickbuzz
    app.kubernetes.io/component: db-migrate
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crickbuzz
        app.kubernetes.io/component: db-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: crickbuzz-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.db.init_db"]
          envFrom:
            - configMapRef:
                name: crickbuzz-config
            - secretRef:
                name: postgres-credentials

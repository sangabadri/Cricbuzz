apiVersion: v1
kind: ConfigMap
metadata:
  name: crickbuzz-config
  namespace: crickbuzz
  labels:
    app.kubernetes.io/name: crickbuzz
    app.kubernetes.io/component: api
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: crickbuzz
  DB_POOL_SIZE: "10"
  DB_MAX_OVERFLOW: "20"
  DB_ECHO: "false"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cricuser
      POSTGRES_PASSWORD: cricpass
      POSTGRES_DB: cricbuzz
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: cricuser
      DB_PASSWORD: cricpass
      DB_NAME: cricbuzz
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata: